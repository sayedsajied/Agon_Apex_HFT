[package]
name = "agon_apex_hft"
version = "0.1.0"
edition = "2021"
authors = ["Sayed Sajied - Solo Quant"]

# यह वो कच्चा माल (Raw Data) है जो इंटरनेट से असली इंजन खींचेगा
[dependencies]
# 1. द मेटा-ब्रेन (असिंक्रोनस इंजन) जो कोड को बिना अटके चलाएगा
tokio = { version = "1.36", features = ["full"] } 

# 2. लाइव टिक-डेटा (WebSocket) खींचने का असली रॉ इंजन 
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] } 
futures-util = "0.3" 

# 3. डेल्टा एक्सचेंज और बायबिट के API से सीधा जुड़ने वाला राउटर
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json"] }
url = "2.5"

# 4. डेटा को डिकोड (JSON Parsing) करने का इंजन
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
